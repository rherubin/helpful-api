name: Workflow lint

# Fails the PR when a workflow file cannot be parsed or actionlint reports
# an error. This catches issues (duplicate YAML keys, invalid `env` blocks)
# that regular test CI never runs, including workflow_dispatch release
# pipelines that would otherwise fail instantly on the Actions tab.
on:
  pull_request:
    branches: [develop, main]
    paths:
      - ".github/workflows/**"
      - ".github/actionlint.yaml"
  push:
    branches: [develop, main]
    paths:
      - ".github/workflows/**"
      - ".github/actionlint.yaml"

concurrency:
  group: workflow-lint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256_AMD64: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
          ACTIONLINT_SHA256_ARM64: "325e971b6ba9bfa504672e29be93c24981eeb1c07576d730e9f7c8805afff0c6"
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64)
              arch=amd64
              sha="${ACTIONLINT_SHA256_AMD64}"
              ;;
            aarch64)
              arch=arm64
              sha="${ACTIONLINT_SHA256_ARM64}"
              ;;
            *)
              echo "Unsupported architecture: $(uname -m)" >&2
              exit 1
              ;;
          esac
          tarball="${RUNNER_TEMP:-/tmp}/actionlint.tar.gz"
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_${arch}.tar.gz" -o "$tarball"
          echo "${sha}  ${tarball}" | sha256sum -c -
          install_dir="${RUNNER_TEMP:-/tmp}/actionlint-bin"
          mkdir -p "$install_dir"
          tar -xzf "$tarball" -C "$install_dir" actionlint
          echo "$install_dir" >> "$GITHUB_PATH"
          "$install_dir/actionlint" -version

      - name: Ensure ShellCheck is installed
        run: |
          set -euo pipefail
          if ! command -v shellcheck >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y shellcheck
          fi
          shellcheck --version

      - name: Lint workflow files
        run: actionlint -color
